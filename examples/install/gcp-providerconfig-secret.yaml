# Traditional GCP ProviderConfig using a service account key stored in a
# Kubernetes Secret. Simplest to set up; least secure (long-lived key).
# This ProviderConfig and its credentials Secret must live in the SAME namespace
# as the ControlPlane XR (here "platform", see examples/install/namespace.yaml):
# a namespaced ProviderConfig reads its Secret from its own namespace, and the
# composed managed resources resolve the ProviderConfig by name within their own
# namespace. The composition's providerConfigName defaults to "default" — change
# metadata.name here only if you also override providerConfigName on the XR.
apiVersion: gcp.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: platform
spec:
  projectID: crossplane-playground
  credentials:
    source: Secret
    # A NAMESPACED ProviderConfig resolves its credentials Secret from its OWN
    # namespace; a cross-namespace secretRef.namespace is ignored. The Secret
    # must therefore live in the same namespace as this ProviderConfig (platform)
    # — where the composed managed resources are also created. Pointing it at
    # crossplane-system yields "Secret gcp-creds not found" and the MRs never
    # reconcile.
    secretRef:
      namespace: platform
      name: gcp-creds
      key: credentials
