apiVersion: gcp.platform.upbound.io/v1alpha1
kind: ControlPlane
metadata:
  name: uxp-ctp-1
spec:
  parameters:
    id: uxp-ctp-1
    location: us-west1
    project: crossplane-playground
    version: "1.34"
    nodes:
      count: 5
      machineType: e2-standard-4
    backup:
      enabled: "yes"
      location: uxpctp1backup
      schedule: "*/15 * * * *"
    license:
      secretRef:
        name: uxp-license
        namespace: default
    knative:
      enabled: "yes"
    providerVerticalPodAutoscaling:
      enabled: "no"
