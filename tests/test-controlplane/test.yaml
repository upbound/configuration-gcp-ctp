# Composition tests for the GCP ControlPlane Python composition.
# Each test renders the composition against a ControlPlane XR fixture and
# asserts that specific composed resources are produced.
---
apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: basic
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: us-central1
        project: my-project
        version: "1.34"
        nodes:
          count: 2
          machineType: e2-standard-2
  assertResources:
  - apiVersion: compute.gcp.m.upbound.io/v1beta1
    kind: Network
    metadata:
      name: test-cp
  - apiVersion: compute.gcp.m.upbound.io/v1beta1
    kind: Subnetwork
    metadata:
      name: test-cp-gke
  - apiVersion: container.gcp.m.upbound.io/v1beta1
    kind: Cluster
    metadata:
      name: test-cp
  - apiVersion: container.gcp.m.upbound.io/v1beta1
    kind: NodePool
    metadata:
      name: test-cp-nodes
    spec:
      forProvider:
        nodeConfig:
          machineType: e2-standard-2
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
    spec:
      forProvider:
        chart:
          version: "2.2.1-up.1"
        values:
          upbound:
            manager:
              metering:
                podSecurityContext:
                  fsGroup: 65532
                  fsGroupChangePolicy: OnRootMismatch
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-release-cluster
    spec:
      of:
        kind: Cluster
      by:
        kind: Release
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-subnetwork-network
    spec:
      of:
        kind: Network
      by:
        kind: Subnetwork
---
apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: backup-enabled
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: us-central1
        project: my-project
        version: "1.34"
        nodes:
          count: 2
          machineType: e2-standard-2
        backup:
          enabled: "yes"
          location: mybackup001
  assertResources:
  - apiVersion: storage.gcp.m.upbound.io/v1beta1
    kind: Bucket
    metadata:
      name: mybackup001
    spec:
      forProvider:
        location: us-central1
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-config
    spec:
      forProvider:
        manifest:
          spec:
            objectStorage:
              provider: GCS
              bucket: mybackup001
              credentials:
                source: InjectedIdentity
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-rbac
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-rbac-binding
---
