apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: backup-uxp-deployed
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: us-central1
        project: my-project
        version: "1.34"
        nodes:
          count: 2
          machineType: e2-standard-2
        backup:
          enabled: "yes"
          location: mybackup001
  observedResources:
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
      namespace: default
      annotations:
        crossplane.io/composition-resource-name: uxp-release
    spec:
      forProvider:
        chart:
          name: crossplane
          repository: oci://xpkg.upbound.io/upbound
          version: 2.2.1-up.1
    status:
      atProvider:
        state: deployed
  assertResources:
  - apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
    kind: ServiceAccount
    metadata:
      name: test-cp-backup-identity
    spec:
      forProvider:
        accountId: test-cp-backup
  - apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
    kind: ServiceAccountIAMMember
    metadata:
      name: test-cp-backup-wi-binding
    spec:
      forProvider:
        role: roles/iam.workloadIdentityUser
        member: serviceAccount:my-project.svc.id.goog[crossplane-system/upbound-controller-manager]
  - apiVersion: storage.gcp.m.upbound.io/v1beta1
    kind: BucketIAMMember
    metadata:
      name: test-cp-backup-bucket-role
    spec:
      forProvider:
        role: roles/storage.objectAdmin
        member: serviceAccount:test-cp-backup@my-project.iam.gserviceaccount.com
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-sa
    spec:
      forProvider:
        manifest:
          kind: ServiceAccount
          metadata:
            name: upbound-controller-manager
            namespace: crossplane-system
            annotations:
              iam.gke.io/gcp-service-account: test-cp-backup@my-project.iam.gserviceaccount.com
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-controller-restart
    spec:
      forProvider:
        manifest:
          kind: Deployment
          metadata:
            name: upbound-controller-manager
            namespace: crossplane-system
