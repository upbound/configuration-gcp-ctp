    metadata:
      name: test-cp-argocd-ingress
    spec:
      forProvider:
        manifest:
          kind: Ingress
          spec:
            ingressClassName: nginx
            rules:
            - host: argocd.example.com
  # argocd pulls in nginx-ingress.
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-ingress-nginx
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-argocd-gke
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-argocd-ingress-gke
---
apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: with-argocd-deployed
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: us-central1
        project: my-project
        version: "1.34"
        nodes:
          count: 2
          machineType: e2-standard-2
        argocd:
          enabled: "yes"
          hostname: argocd.example.com
          url: https://github.com/example/apps
  observedResources:
  # cert-manager deployed -> issuer + certificate render; argocd deployed ->
  # the root Application renders.
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-certmanager
      namespace: default
      annotations:
        crossplane.io/composition-resource-name: certmanager-release
    status:
      atProvider:
        state: deployed
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-argocd
      namespace: default
      annotations:
        crossplane.io/composition-resource-name: argocd-release
    status:
      atProvider:
        state: deployed
  assertResources:
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-argocd-issuer
    spec:
      forProvider:
        manifest:
          kind: ClusterIssuer
          metadata:
            name: argocd-selfsigned
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-argocd-cert
    spec:
      forProvider:
        manifest:
          kind: Certificate
          spec:
            secretName: argocd-server-tls
            issuerRef:
              name: argocd-selfsigned
              kind: ClusterIssuer
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-argocd-app
    spec:
      forProvider:
        manifest:
          kind: Application
          spec:
            source:
              repoURL: https://github.com/example/apps
              path: "."
              targetRevision: HEAD
