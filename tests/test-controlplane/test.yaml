# Composition tests for the GCP ControlPlane Python composition.
# Each test renders the composition against a ControlPlane XR fixture and
# asserts that specific composed resources are produced.
---
apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: basic
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: us-central1
        project: my-project
        version: "1.34"
        nodes:
          count: 2
          machineType: e2-standard-2
  assertResources:
  - apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: Network
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        region: us-central1
        providerConfigName: default
  - apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: GKE
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        project: my-project
        region: us-central1
        version: "1.34"
        workloadIdentity:
          enabled: true
        nodes:
          count: 2
          instanceType: e2-standard-2
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
    spec:
      forProvider:
        chart:
          version: "2.2.1-up.1"
        values:
          upbound:
            manager:
              metering:
                podSecurityContext:
                  fsGroup: 65532
                  fsGroupChangePolicy: OnRootMismatch
  # cert-manager is always installed, decoupled from the knative/license gates.
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-certmanager
    spec:
      forProvider:
        chart:
          name: cert-manager
          repository: https://charts.jetstack.io
        namespace: cert-manager
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-release-gke
    spec:
      of:
        kind: GKE
      by:
        kind: Release
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-gke-network
    spec:
      of:
        kind: Network
      by:
        kind: GKE
---
