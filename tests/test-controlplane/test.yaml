apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: with-k8gb-endpoint
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: us-central1
        project: my-project
        version: "1.34"
        nodes:
          count: 2
          machineType: e2-standard-2
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
  observedResources:
  # CoreDNS observe Object reports the provisioned GCP LB endpoint (an IP).
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-k8gb-coredns
      namespace: default
      annotations:
        crossplane.io/composition-resource-name: k8gb-coredns-observe
    status:
      atProvider:
        manifest:
          status:
            loadBalancer:
              ingress:
              - ip: 203.0.113.10
  assertResources:
  # The XR surfaces the k8gb status contract for FleetGslb.
  - apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    status:
      controlplane:
        k8gb:
          enabled: "yes"
          coreDNSEndpoint: 203.0.113.10
          delegationRecord: "gslb.example.com. NS gslb-ns-gslb-example-com-gcp-us-central1-test-cp.example.com. ; gslb-ns-gslb-example-com-gcp-us-central1-test-cp.example.com. A 203.0.113.10"
---
