# E2E test: GCP ControlPlane with the k8gb + ArgoCD add-ons enabled.
# Spins up a real GKE cluster via the configuration-gcp-ctp composition, installs
# UXP, and then the full add-on stack: cert-manager (always-on), the Envoy Gateway data plane,
# k8gb (operator + CoreDNS exposed via a native GCP external LB), and ArgoCD
# (UI Gateway/HTTPRoute + root app-of-apps).
#
# Credentials: the GCP ProviderConfig "default" (namespaced, in the "default"
# namespace) uses Upbound-injected identity federated to the solutions e2e GCP
# service account, so no pre-provisioned Secret is required on the ephemeral
# test control plane.
#
# What this asserts: the ControlPlane XR reaches Ready=True. Because
# function-auto-ready aggregates every composed resource, Ready=True implies all
# add-on Releases reached state=deployed and every add-on Object was applied —
# i.e. the whole add-on stack installs cleanly.
#
# Scope: this is an *installation* e2e. It does NOT test DNS failover — nothing
# writes the NS delegation yet (FleetGslb is a separate workstream), so GSLB is
# not functional end-to-end. The real GCP LB endpoint is surfaced on
# status.controlplane.k8gb.coreDNSEndpoint; verify it is non-empty manually
# (E2ETest cannot assert arbitrary status fields). No license is supplied — the
# add-ons here need none.
#
# The CoreDNS LB is a backend-service (RBS) external passthrough NLB serving
# TCP+UDP:53 — it needs GKE >= 1.26 (satisfied by version "1.34" below). If the
# RBS mixed-protocol LB proves flaky to provision, the sanctioned fallback is a
# single UDP:53 port (see docs/ctp-addons-implementation-plan.md, Step 3).
#
# Requires sufficient GCP quota for one e2-standard-2 two-node GKE cluster in
# us-central1 plus the external LBs the add-ons provision.
# Expected runtime: 40-70 minutes.
apiVersion: meta.dev.upbound.io/v1alpha1
kind: E2ETest
metadata:
  name: controlplane-with-addons
spec:
  crossplane:
    autoUpgrade:
      channel: Stable
  defaultConditions:
  - Ready
  timeoutSeconds: 5400
  cleanupTimeoutSeconds: 1800
  extraResources:
  - apiVersion: gcp.m.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
      namespace: default
    spec:
      projectID: crossplane-playground
      credentials:
        source: Upbound
        upbound:
          federation:
            providerID: projects/283222062215/locations/global/workloadIdentityPools/solutions-upbound-oidc-pool/providers/solutions-u5d-oidc-pool
            serviceAccount: solutions-u5d-service-account@crossplane-playground.iam.gserviceaccount.com
  manifests:
  - apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: e2e-addons-cp
    spec:
      parameters:
        id: e2eaddonscp
        location: us-central1
        project: crossplane-playground
        version: "1.34"
        nodes:
          count: 2
          machineType: e2-standard-2
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
          strategy: failover
        argocd:
          enabled: "yes"
          hostname: argocd.example.com
          url: https://github.com/argoproj/argocd-example-apps
  skipDelete: false
