# Single comprehensive E2E test for configuration-gcp-ctp.
#
# Spins up a real GKE cluster via the composition and exercises the full stack in
# one run: UXP + GKE Workload-Identity backup (GCS) + the k8gb producer (operator
# + CoreDNS via a native GCP external Network LB) + ArgoCD (UI Gateway/HTTPRoute +
# app-of-apps), which also pulls in cert-manager (always-on) and the Envoy Gateway
# data plane.
#
# WHY ONE TEST: a single comprehensive e2e (mirroring configuration-azure-ctp)
# covers the whole composition in one GKE cluster instead of provisioning a second
# cluster for a separate add-ons run, roughly halving total e2e wall-clock. GCP e2e
# auth uses a shared solutions-e2e Upbound-injected identity (not an Azure-style
# per-test federated credential), so the test name is not auth-coupled.
#
# Credentials: the GCP ProviderConfig "default" (namespaced, in the "default"
# namespace where the composed managed resources live) uses Upbound-injected
# identity (source: Upbound) federated to the shared solutions-e2e GCP service
# account, so no pre-provisioned Secret is required on the ephemeral test control
# plane.
#
# What this asserts: the ControlPlane XR reaches Ready=True. Because
# function-auto-ready aggregates every composed resource, Ready=True implies UXP,
# the backup chain + Workload Identity, and every add-on Release/Object
# (cert-manager, the Envoy Gateway data plane, k8gb + CoreDNS, ArgoCD +
# Gateway/HTTPRoute) came up cleanly. The k8gb CoreDNS endpoint is surfaced on
# status.controlplane.k8gb.coreDNSEndpoint (verify non-empty manually - E2ETest
# cannot assert arbitrary status fields).
#
# Scope: installation only. It does NOT test DNS failover - nothing writes the NS
# delegation yet (FleetGslb is a separate workstream). No license is supplied; the
# backup wiring and add-ons need none (executing a real backup needs a UXP
# Standard+ license, which this test does not trigger).
#
# The k8gb CoreDNS LB is a backend-service (RBS) external passthrough NLB serving
# TCP+UDP:53 - it needs GKE >= 1.26 (satisfied by version "1.34" below).
#
# Requires GCP quota for one e2-standard-2 two-node GKE cluster in us-central1, a
# globally-unique GCS bucket name, plus the external LBs the add-ons provision.
# Expected runtime: 40-70 minutes.
apiVersion: meta.dev.upbound.io/v1alpha1
kind: E2ETest
metadata:
  name: controlplane
spec:
  crossplane:
    autoUpgrade:
      channel: Stable
  defaultConditions:
  - Ready
  timeoutSeconds: 5400
  cleanupTimeoutSeconds: 1800
  extraResources:
  - apiVersion: gcp.m.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
      namespace: default
    spec:
      projectID: crossplane-playground
      credentials:
        source: Upbound
        upbound:
          federation:
            providerID: projects/283222062215/locations/global/workloadIdentityPools/solutions-upbound-oidc-pool/providers/solutions-u5d-oidc-pool
            serviceAccount: solutions-u5d-service-account@crossplane-playground.iam.gserviceaccount.com
  manifests:
  - apiVersion: gcp.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: e2e-test-cp
    spec:
      parameters:
        id: e2etestcp
        location: us-central1
        project: crossplane-playground
        version: "1.34"
        nodes:
          count: 2
          machineType: e2-standard-2
        backup:
          enabled: "yes"
          location: e2etestcpbackup
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
          strategy: failover
        argocd:
          enabled: "yes"
          hostname: argocd.example.com
          url: https://github.com/argoproj/argocd-example-apps
  skipDelete: false
